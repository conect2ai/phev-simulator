<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHEV por dentro · Simulador</title>
<meta name="description" content="Simulador 3D de um SUV híbrido plug-in. Recarga AC e DC, diagnóstico pela porta OBD-II e caminho dos sinais até a central multimídia. Conect2ai, UFRN.">
<meta name="theme-color" content="#07080a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307080a'/%3E%3Cpath d='M9 21h14M11 21l2-6h6l2 6M13 11l3-3 3 3' stroke='%2300aad0' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<div id="stage" aria-label="Cena 3D do veículo"></div>
<div id="labels" aria-hidden="true"></div>

<header id="brand" class="glass ui">
  <div class="eyebrow"><b>Conect2ai</b> · UFRN</div>
  <h1 data-i18n="title">PHEV por dentro</h1>
  <p data-i18n="subtitle">Simulador de recarga, diagnóstico OBD-II e multimídia</p>
</header>

<nav id="tabs" class="glass ui" aria-label="Módulos">
  <button data-tab="overview" class="tab"><span class="n">00</span><span data-i18n="tabs.overview">Visão geral</span></button>
  <button data-tab="charging" class="tab"><span class="n">01</span><span data-i18n="tabs.charging">Recarga</span></button>
  <button data-tab="obd" class="tab"><span class="n">02</span><span data-i18n="tabs.obd">OBD-II</span></button>
  <button data-tab="hu" class="tab"><span class="n">03</span><span data-i18n="tabs.hu">Multimídia</span></button>
</nav>

<div id="toolbar" class="ui">
  <button id="btnTour" class="tool primary" data-i18n="tour">Tour guiado</button>
  <button id="btnXray" class="tool" aria-pressed="false" data-i18n="xray">Raio-X</button>
  <button id="btnTech" class="tool" aria-pressed="false" data-i18n="tech">Modo técnico</button>
  <button id="btnLang" class="tool" aria-label="Idioma">EN</button>
  <button id="btnPanel" class="tool only-mobile" aria-expanded="false" data-i18n="panel">Configurações</button>
</div>

<aside id="panel" class="glass ui" aria-label="Configurações"></aside>

<section id="tech" class="glass ui" hidden>
  <div class="tech-h"><span id="techTitle">CAN</span><span id="techMeta" class="muted"></span></div>
  <div id="techBody"></div>
</section>

<section id="explain" class="glass ui" aria-live="polite">
  <div id="tourBar" hidden>
    <span id="tourCount" class="mono"></span>
    <div class="tprog"><i id="tourProg"></i></div>
    <button id="tourPrev" class="mini" aria-label="Anterior">◀</button>
    <button id="tourNext" class="mini" aria-label="Próximo">▶</button>
  </div>
  <div class="eyebrow" id="exKicker"></div>
  <h2 id="exTitle"></h2>
  <p id="exText"></p>
  <div class="legend">
    <span><i style="background:var(--cyan)"></i><em data-l="e">Energia elétrica</em></span>
    <span><i style="background:var(--amber)"></i><em data-l="f">Combustível</em></span>
    <span><i style="background:var(--violet)"></i><em data-l="d">Dados</em></span>
    <span><i style="background:var(--hv)"></i><em data-l="h">Alta tensão</em></span>
  </div>
</section>

<section id="hud" class="glass ui" aria-label="Leituras"></section>

<div id="huModal" class="modal" hidden>
  <div class="modal-card glass">
    <div class="modal-h"><h3 id="huModalTitle"></h3><button id="huClose" class="tool"></button></div>
    <canvas id="huBig" width="1280" height="720"></canvas>
    <div class="modal-row">
      <label for="huLimit" id="huLimitLbl"></label>
      <input type="range" id="huLimit" min="50" max="100" step="5">
      <output id="huLimitOut" class="mono"></output>
    </div>
    <p id="huLimitHint" class="muted small"></p>
  </div>
</div>

<noscript><p class="noscript">Este simulador precisa de JavaScript e WebGL.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
